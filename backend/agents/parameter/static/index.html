<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sketch2CAD Parameter Agent</title>
    <!-- Modern Typography: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="header-content">
                <div class="logo">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M2 17L12 22L22 17" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M2 12L12 17L22 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <h1>Sketch2CAD Parameter Agent</h1>
                </div>
                <div class="status-indicator">
                    <span class="pulse"></span>
                    <span id="session-status">Idle</span>
                </div>
            </div>
        </header>

        <main class="chat-container">
            <div id="chat-messages" class="chat-messages">
                <!-- Welcome Message -->
                <div class="message assistant-message initial-message">
                    <div class="message-bubble">
                        Hello! I am the Sketch2CAD Parameter Agent. I can help you determine missing parameters for shapes. Try saying something like "I want to create a box".
                    </div>
                </div>
            </div>
            
            <div id="typing-indicator" class="typing-indicator hidden">
                <span></span><span></span><span></span>
            </div>
        </main>

        <footer class="input-container">
            <form id="chat-form" class="chat-form">
                <input 
                    type="text" 
                    id="message-input" 
                    placeholder="Enter shape or parameters..." 
                    autocomplete="off"
                    required
                >
                <button type="submit" id="send-button" class="send-button">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M22 2L11 13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M22 2L15 22L11 13L2 9L22 2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
            </form>
        </footer>
        
        <!-- Extracted parameters panel -->
        <div class="side-panel">
            <h3>Current State</h3>
            <div class="state-group">
                <span class="label">Shape:</span>
                <span id="state-shape" class="value">-</span>
            </div>
            <div class="state-group">
                <span class="label">Parameters:</span>
                <ul id="state-params" class="params-list">
                    <li class="empty-params">None collected</li>
                </ul>
            </div>
        </div>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
